[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mcp-rbac-gateway"
dynamic = ["version"]
description = "A lightweight security, RBAC, and audit gateway for Model Context Protocol (MCP) servers and AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pavankalyan Maturi" }]
keywords = ["mcp", "model-context-protocol", "ai-agents", "security", "rbac", "audit", "llm", "langgraph", "prompt-injection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "rich>=13.0",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
langgraph = ["langgraph>=0.2", "langchain-core>=0.3"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-PyYAML",
]

[project.scripts]
mcp-sentinel = "mcp_sentinel.cli:main"

[project.urls]
Homepage = "https://github.com/pavankalyan-Maturi/mcp-sentinel"
Repository = "https://github.com/pavankalyan-Maturi/mcp-sentinel"
Issues = "https://github.com/pavankalyan-Maturi/mcp-sentinel/issues"
Changelog = "https://github.com/pavankalyan-Maturi/mcp-sentinel/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/mcp_sentinel/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_sentinel"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
